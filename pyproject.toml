[project]
name = "code-review-agent"
version = "0.1.0"
description = "Parallel LangGraph code reviewers for Python pull request changes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.2",
]

[project.scripts]
code-review-agent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "cli.py", "graph.py", "repository.py", "schemas.py", "tools.py", "report.py", "integrations", "history.py", "scanners.py", "coverage_analysis.py", "citations.py", "coverage_runner.py", "app.py", "rules"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
scanners = ["radon>=6", "pylint>=3", "pip-audit>=2.7"]
semgrep = ["semgrep>=1.100"]
dev = ["pytest>=8", "pytest-cov>=6", "coverage>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
